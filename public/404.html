<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Página não encontrada · mechanicAI</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #12151a;
        color: #f2f4f7;
        font-family: system-ui, sans-serif;
      }
      main {
        width: min(100% - 32px, 28rem);
      }
      h1 {
        font-size: 1.6rem;
        line-height: 1.2;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 48px;
        padding: 0 16px;
        border-radius: 12px;
        background: #f0b429;
        color: #1a1400;
        font-weight: 700;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p>mechanicAI</p>
      <h1>Página não encontrada</h1>
      <p>Esse endereço não existe. O aplicativo abre na página inicial.</p>
      <p><a id="home" href="./">Voltar para o mechanicAI</a></p>
    </main>
    <script>
      const onPages = location.hostname.endsWith('github.io')
      const segment = location.pathname.split('/').filter(Boolean)[0]
      const home = onPages && segment ? '/' + segment + '/' : './'
      document.getElementById('home').setAttribute('href', home)
    </script>
  </body>
</html>
